# Configuración de cargo-deny para MiFutbolR.
[advisories]
version = 2
yanked = "warn"
ignore = [
    # Sin mantenimiento, no vulnerable. Se usa en 32 archivos; migrar a `jiff`
    # o `time` es una tarea propia (ver odd/tasks/recomendaciones.md).
    { id = "RUSTSEC-2026-0543", reason = "chrono sin mantenimiento; migración pendiente" },
]

[licenses]
version = 2
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    # webpki-roots (certificados raíz de Mozilla para rustls, vía ureq).
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
